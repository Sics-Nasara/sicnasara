<!DOCTYPE html>
{% load custom_filters %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SICS NASARA</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
<!-- Include Bootstrap CSS and JS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>  
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 
<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
<!-- DataTables Buttons CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.1.0/css/buttons.dataTables.min.css">
<!-- DataTables JavaScript -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

<!-- DataTables Export Buttons -->
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css">
<script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
</head>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

  
    body {
       width: 100%;
        background: #FFFFFFFF;
      
    } 
  
    .menu-separator {
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: #4f52ba;
        transform-origin: right;
        transition: transform 0.3s;
        transform: scaleX(1);
    }
   

  

    

    .content {
        padding-top: 70px; /* Adjust based on navbar height */
        transition: margin-left 0.4s ease, width 0.4s ease;
    }

    .content h1 {
        font-size: 1rem;
        color: #333;
        margin-bottom: 20px;
    }

    .content p {
        color: #555;
        font-size: 0.7rem;
        line-height: 1.6;
    }
    .navbar {
        position: fixed; /* Add this to keep the navbar fixed */
        top: 0; /* Position at the top of the page */
        width: 100%; /* Span the full width of the page */
        background-color: black; /* Your existing background color */
        z-index: 1000; /* Ensure it stays on top of other elements */
    }
    
  .class-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #A6A6A6FF;
    color: #fff;
    padding: 10px 30px; /* Reduced padding */
  
    text-align: center;
    
    text-decoration: none;
    
    
   
}
 
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.8);
    display: none; /* Initially hidden */
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.loader-box {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 9999;
    background: #1100ADFF;
  }
  #loader {
    animation: animate 1.5s linear infinite;
    clip: rect(0, 80px, 80px, 40px);
    height: 80px;
    width: 80px;
    position: absolute;
    left: calc(50% - 40px);
    top: calc(50% - 40px);
  }
  @keyframes animate {
    0% {
      transform: rotate(0deg);
    }
  100% {
    transform: rotate(220deg);
    }
  }
  #loader:after {
    animation: animate2 1.5s ease-in-out infinite;
    clip: rect(0, 80px, 80px, 40px);
    content: "";
    border-radius: 50%;
    height: 80px;
    width: 80px;
    position: absolute;
  }
  @keyframes animate2 {
    0% {
      box-shadow: inset #fff 0 0 0 17px;
      transform: rotate(-140deg);
    }
    50% {
      box-shadow: inset #fff 0 0 0 2px;
    }
    100% {
      box-shadow: inset #fff 0 0 0 17px;
      transform: rotate(140deg);
    }
  }
</style>
<body>
  
    <div class="loader-box">
        <div id="loader"></div>
      </div>
  {% comment %}
      <div id="loading-spinner" class="loading-overlay">
          <div class="spinner-border text-primary" role="status">
              <span class="sr-only">Loading...</span>
          </div>
      </div>
      
  {% endcomment %}
 
  <div class="content">
    <nav class="navbar">
        {% block header %}
            <span class="navbar-brand mb-0 h1">Navbar</span>
            <h2><strong>{{ page_identifier }}</strong></h2>
    
         
      
        {% endblock header %}
    </nav>
   
    {% block content %}


  
    {% endblock content %}
  </div>
</body>
<script>
    $(window).on('load', function () {
      $('.loader-box').fadeOut(300)
    })
  </script>


<script>

    

    // Undo (Back) Button
    document.getElementById('undo-button').addEventListener('click', function() {
        window.history.back(); // Navigate back in history
    });

    // Redo (Forward) Button
    document.getElementById('redo-button').addEventListener('click', function() {
        window.history.forward(); // Navigate forward in history
    });
</script>
<script>

  
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.1.0/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.1.0/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.1.0/js/buttons.print.min.js"></script>
</script>
</html>
