[uwsgi]
http = :8001
instance_dir = /var/www/sicsnasara/prod
module = sig.wsgi_prod:application
env = PYTHONIOENCODING=UTF-8
chdir = %(instance_dir)
master = true
socket = /var/www/sicsnasara/prod/sicsnasara_prod.sock
chmod-socket = 660 
post-buffering = 1024
processes = 3
cheaper = 1
lazy = true
reload-on-rss = 128
uid = nasara
gid = www-data
vacuum = true
no-orphan = true
single-interpreter = true
limit-post = 5242880
touch-reload = %(instance_dir)/app_prod.ini
daemonize = /var/log/sicsnasara/prod/uwsgi.log
log-5xx = true
virtualenv = /home/nasara/.local/share/virtualenvs/prod-92wbzbly
safe-pidfile = %(instance_dir)/app_prod.pid
buffer-size=20000




