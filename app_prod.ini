[uwsgi]
instance_dir = /var/www/sicsnasara/prod
module = sig.wsgi_prod  # Ensure this points to the correct WSGI application for production
env = PYTHONIOENCODING=UTF-8
chdir = %(instance_dir)  # Changes the working directory to the instance directory
master = true
socket = /var/www/sicsnasara/prod/sicsnasara_prod.sock  # Socket for communication (change path as needed)
chmod-socket = 660  # Permissions for the socket file
post-buffering = 1024  # Buffer size for POST requests
processes = 3  # Number of worker processes (adjust as needed)
cheaper = 1  # Cheaper algorithm settings (dynamic process management)
lazy = true  # Load application only when needed
reload-on-rss = 128  # Reload if memory usage exceeds this value (in MB)
uid = nasara  # User to run the processes as
gid = www-data  # Group to run the processes as
vacuum = true  # Cleanup temporary files on exit
no-orphan = true  # Do not allow orphan processes
single-interpreter = true  # Use a single Python interpreter for all workers
limit-post = 5242880  # Limit for POST requests (5 MB)
touch-reload = %(instance_dir)/app_prod.ini  # Reload if this file changes
daemonize = /var/log/sicsnasara/prod/uwsgi.log  # Log file for uWSGI output
log-5xx = true  # Log HTTP 5xx errors
virtualenv = /home/nasara/.local/share/virtualenvs/prod-92wbzbly  # Path to the virtual environment
safe-pidfile = %(instance_dir)/app_prod.pid  # PID file for uWSGI process management
buffer-size=20000  # Buffer size for requests/responses (20 KB)


