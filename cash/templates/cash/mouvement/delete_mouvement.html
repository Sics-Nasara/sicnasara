
{% extends "../../layout.html" %}
{% block header %}
<span class="navbar-brand mb-0 h1">Navbar</span>
          
    
            <!-- Undo and Redo Icons -->
            <div class="ml-2 d-flex align-items-stretch">
               <button class=" mr-3 class-card " id="undo-button" title="Undo">
                    <i class="fas fa-undo fa-lg"></i>
                </button>
                <h2 class='mr-3'><strong>{{ page_identifier }}</strong></h2>
            </div>
{% endblock header %}
{% block content %}
    <h1>Delete Mouvement</h1>
    <p>Are you sure you want to delete this mouvement?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
        <a href="{% url 'mouvement_list' %}">Cancel</a>
    </form>
{% endblock %}
